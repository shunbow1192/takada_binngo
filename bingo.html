<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff9f0">
  <meta name="description" content="高田同窓会ビンゴ大会の受付・待機ページです。">
  <title>高田同窓会ビンゴ大会 | 開始までお待ちください</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <!-- このCSSは静的ファイル。Firebaseには接続しません。 -->
  <link rel="stylesheet" href="./bingo.css">
  <style>
    /* このページでは、元のbingo.jsを読み込まないことが重要 */
    .gate-shell { max-width: 1010px; margin: 0 auto; padding: 20px 24px 40px; }
    .gate-brand { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 19px; padding: 4px 0 28px; }
    .gate-star { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 13px; color: #fff; background: #ffda68; box-shadow: 0 4px 0 #eebf5b; transform: rotate(-8deg); }
    .gate-brand b { color: #f45a81; }
    .gate-hero { position: relative; overflow: hidden; text-align: center; padding: 38px 18px; border: 2px solid #fff8fa; border-radius: 34px; background: linear-gradient(117deg, #ffe4d4, #ffe1e6 42%, #eee4ff); box-shadow: 0 15px 42px rgba(81,57,102,.09); }
    .gate-hero h1 { font-size: clamp(36px,6.5vw,58px); line-height: 1.2; font-weight: 900; margin: 0; letter-spacing: .03em; }
    .gate-hero h1 span { color: #fa6587; }
    .gate-deco { position: absolute; font-size: 24px; color: #f69bbd; }
    .gate-deco.left { left: 8%; top: 18%; }
    .gate-deco.right { right: 8%; bottom: 16%; color: #9e85f0; }
    .gate-wait { max-width: 700px; margin: 28px auto 0; text-align: center; border-radius: 28px; background: #fff; box-shadow: 0 15px 42px rgba(81,57,102,.09); padding: 38px 22px; border: 1px solid #f4e4ec; }
    .gate-icon { font-size: 56px; line-height: 1.25; }
    .gate-kicker { display: inline-block; background: #fff0f5; border-radius: 999px; padding: 7px 18px; color: #d24c82; font-weight: 900; margin: 18px 0 16px; }
    .gate-wait h2 { font-size: clamp(21px, 4.3vw, 30px); font-weight: 900; margin: 0 0 12px; }
    .gate-wait p { color: #746b7d; margin: 0 auto 20px; line-height: 1.8; }
    .gate-status { font-size: 14px; color: #685e72; border-radius: 14px; background: #f7f3ff; padding: 12px 15px; }
    .gate-dots { display: inline-flex; gap: 5px; margin-right: 4px; }
    .gate-dots i { width: 6px; height: 6px; border-radius: 50%; background: #9878e6; animation: gate-pulse 1.2s ease-in-out infinite; }
    .gate-dots i:nth-child(2) { animation-delay: .2s; }
    .gate-dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes gate-pulse { 0%, 65%, 100% { opacity: .25; } 30% { opacity: 1; } }
    .gate-footer { text-align: center; color: #80738c; margin-top: 34px; font-size: 13px; }
    @media (max-width: 640px) { .gate-shell { padding: 16px 14px 30px; } .gate-wait { padding: 32px 17px; margin-top: 20px; } .gate-hero { padding: 35px 14px; } }
    @media (prefers-reduced-motion: reduce) { .gate-dots i { animation: none; opacity: 1; } }
  </style>
</head>
<body>
  <div class="gate-shell">
    <header class="gate-brand"><span class="gate-star" aria-hidden="true">★</span><span>TAKADA <b>BINGO!</b></span></header>
    <main>
      <section class="gate-hero">
        <span class="gate-deco left" aria-hidden="true">✦</span>
        <span class="gate-deco right" aria-hidden="true">✳</span>
        <h1>高田同窓会<br><span>ビンゴ大会！</span></h1>
      </section>
      <section class="gate-wait" aria-labelledby="waiting-title">
        <div class="gate-kicker">COMING SOON</div>
        <h2 id="waiting-title">ビンゴ大会開始まで<br>お待ちください！</h2>
        <div class="gate-status" id="gateStatus" role="status" aria-live="polite">
          <span class="gate-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
      </section>
    </main>
    <footer class="gate-footer">✦ ★ ✦<p>高田同窓会ビンゴ大会</p></footer>
  </div>
  <script>
    (() => {
      'use strict';
      // 管理者はこれまでの「bingo.html?admin=1」で利用できる。
      // 新しい実際の管理画面「bingo-live.html?admin=1」へ移動する。
      if (new URLSearchParams(location.search).get('admin') === '1') {
        location.replace('./bingo-live.html?admin=1');
        return;
      }

      const status = document.getElementById('gateStatus');
      let checking = false;
      let opening = false;
      let checkedOnce = false;

      async function checkOpenState() {
        if (checking || opening || document.hidden) return;
        checking = true;
        try {
          // GitHub Pagesの静的JSONだけを読む。Firestoreの読み取りではない。
          // 毎回クエリを変え、古いJSONキャッシュを読み続けるのを避ける。
          const response = await fetch('./bingo-open.json?check=' + Date.now(), {
            cache: 'no-store'
          });
          if (!response.ok) throw new Error('公開状態を読み込めません');
          const state = await response.json();
          if (state.open === true) {
            opening = true;
            status.textContent = '🎉 ビンゴ大会のページに移動します！';
            location.replace('./bingo-live.html');
            return;
          }
          status.textContent = '⏳ 開始の合図を待っています（自動で切り替わります）';
          checkedOnce = true;
        } catch (error) {
          status.textContent = checkedOnce
            ? '⏳ 開始の合図を待っています（接続を確認中）'
            : '📡 開始の合図を確認中です。画面はそのままでOK！';
        } finally {
          checking = false;
        }
      }

      checkOpenState();
      // 約30秒ごとにGitHub Pagesの静的JSONだけを確認。
      setInterval(checkOpenState, 30000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) checkOpenState();
      });
      window.addEventListener('online', checkOpenState);
    })();
  </script>
</body>
</html>
